name: Build and deploy Aseprite

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  LATEST_TAG: v1.3.18.6
  ASEPRITE_SOURCE_URL: https://github.com/aseprite/aseprite/releases/download/v1.3.18.6/Aseprite-v1.3.18.6-Source.zip
  SKIA_URL: https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip

jobs:
  build-aseprite:
    name: Build Aseprite
    runs-on: windows-latest
    steps:
      - name: Get Skia from cache
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-windows-m124-cache

      - name: Download Skia if not in cache
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          curl -f -o Skia-Windows-Release-x64.zip -L "$SKIA_URL"
          7z x Skia-Windows-Release-x64.zip -oskia

      - name: Prepare absolute Skia paths and find libjpeg
        shell: bash
        run: |
          set -e
          SKIA_ABS="$(cygpath -m "$PWD/skia")"
          echo "SKIA_ABS=$SKIA_ABS" >> "$GITHUB_ENV"

          LIB="$(find skia/out/Release-x64 -iname '*jpeg*.lib' | head -n 1)"
          if [ -z "$LIB" ]; then
            echo "ERROR: jpeg library not found in skia/out/Release-x64"
            exit 1
          fi
          LIB_ABS="$(cygpath -m "$PWD/$LIB")"
          echo "LIBJPEG_LIB=$LIB_ABS" >> "$GITHUB_ENV"
          echo "Found: $LIB_ABS"

      - name: Download Aseprite source
        shell: bash
        run: |
          set -e
          curl -f -o Aseprite-source.zip -L "$ASEPRITE_SOURCE_URL"
          7z x Aseprite-source.zip -oaseprite
          mkdir -p aseprite/build

      - name: Setting Visual Studio build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run CMake
        working-directory: aseprite/build
        shell: cmd
        run: cmake -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DCMAKE_IGNORE_PATH="C:/ProgramData/chocolatey/bin/;C:/Strawberry/c/bin/" -DLAF_BACKEND=skia -DSKIA_DIR=%SKIA_ABS% -DSKIA_LIBRARY_DIR=%SKIA_ABS%/out/Release-x64 -DLIBJPEG_TURBO_LIBRARY=%LIBJPEG_LIB% -G Ninja ..

      - name: Run Ninja
        working-directory: aseprite/build
        run: ninja aseprite

      - name: Clean up build
        working-directory: aseprite/build/bin
        shell: bash
        run: rm -f gen modp_b64_gen gen.exe gen.exe.manifest modp_b64_gen.exe modp_b64_gen.exe.manifest

      - name: Make portable zip
        working-directory: aseprite/build/bin
        shell: bash
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini

      - name: Create release zip
        working-directory: aseprite/build/bin
        shell: bash
        run: 7z a -tzip "Aseprite-${LATEST_TAG}-Windows.zip" *

      - name: Check release zip exists
        shell: bash
        run: |
          set -e
          ZIP="aseprite/build/bin/Aseprite-${LATEST_TAG}-Windows.zip"
          ls -la aseprite/build/bin | head -n 40
          test -f "$ZIP" || { echo "ERROR: $ZIP not found"; exit 1; }
          ls -la "$ZIP"

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.LATEST_TAG }}-${{ github.run_number }}
          name: Release Aseprite ${{ env.LATEST_TAG }} (Build #${{ github.run_number }})
          body: Manual build of Aseprite ${{ env.LATEST_TAG }}
          draft: false
          prerelease: false
          files: aseprite/build/bin/Aseprite-${{ env.LATEST_TAG }}-Windows.zip
          fail_on_unmatched_files: true
