name: Build and deploy Aseprite

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  LATEST_TAG: v1.3.18.6
  DOWNLOAD_URL: https://github.com

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest
    outputs:
      download_url: ${{ env.DOWNLOAD_URL }}
      latest_tag: ${{ env.LATEST_TAG }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.LATEST_TAG }}-${{ github.run_number }}
        release_name: Release Aseprite ${{ env.LATEST_TAG }} (Build #${{ github.run_number }})
        body: |
          Manual build of Aseprite ${{ env.LATEST_TAG }}
        draft: false
        prerelease: false
  
  build-aseprite:
    name: Build Aseprite
    needs: check-version
    runs-on: windows-latest
    steps:
      - name: Get Skia from cache
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-windows-v2-cache
      - name: Download Skia if not in cache
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          curl -f -o Skia-Windows-Release-X64.zip -L https://github.com
          7z x Skia-Windows-Release-X64.zip -oskia
      - name: Download Aseprite release
        run: |
          curl -f -o Aseprite-source.zip -L ${{ needs.check-version.outputs.download_url }}
          7z x Aseprite-source.zip -daseprite
          mkdir -p aseprite/build
      - name: Setting Visual Studio build environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Run CMake
        working-directory: aseprite/build
        shell: cmd
        run: cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_IGNORE_PATH='C:/ProgramData/chocolatey/bin/;C:/Strawberry/c/bin/' -DLAF_BACKEND=skia -DSKIA_DIR=../../skia -DSKIA_LIBRARY_DIR=../../skia/out/Release-x64 -G Ninja ..
      - name: Run Ninja
        working-directory: aseprite/build
        run: ninja aseprite
      - name: Clean up build
        working-directory: aseprite/build/bin
        shell: bash
        run: rm -f gen modp_b64_gen gen.exe gen.exe.manifest modp_b64_gen.exe modp_b64_gen.exe.manifest
      - name: Make portable zip
        working-directory: aseprite/build/bin
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini
      - name: Create release zip
        working-directory: aseprite/build/bin
        run: 7z a -tzip Aseprite-${{ needs.check-version.outputs.latest_tag }}-Windows.zip *
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.check-version.outputs.upload_url }}
          asset_path: aseprite/build/bin/Aseprite-${{ needs.check-version.outputs.latest_tag }}-Windows.zip
          asset_name: Aseprite-${{ needs.check-version.outputs.latest_tag }}-Windows.zip
          asset_content_type: application/zip
