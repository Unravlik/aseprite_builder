name: Build and deploy Aseprite

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  LATEST_TAG: v1.3.18.6
  ASEPRITE_SOURCE_URL: https://github.com/aseprite/aseprite/releases/download/v1.3.18.6/Aseprite-v1.3.18.6-Source.zip
  SKIA_URL: https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
  # ПРОВЕРЬТЕ: тег не подтверждён. Должен соответствовать версии libjpeg-turbo в skia/DEPS для m124
  LIBJPEG_TAG: "3.0.4"

jobs:
  build-aseprite:
    name: Build Aseprite
    runs-on: windows-latest
    steps:
      - name: Get Skia from cache
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-windows-m124-cache

      - name: Download Skia if not in cache
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          curl -f -o Skia-Windows-Release-x64.zip -L "$SKIA_URL"
          7z x Skia-Windows-Release-x64.zip -oskia

      - name: Inspect Skia archive
        shell: bash
        run: |
          ls skia
          echo "--- out/Release-x64 ---"
          ls skia/out/Release-x64 || true
          echo "--- jpeg files ---"
          find skia -iname "*jpeg*" | head -n 30 || true

      - name: Get libjpeg-turbo sources if missing
        shell: bash
        run: |
          set -e
          if [ ! -d skia/third_party/externals/libjpeg-turbo ]; then
            mkdir -p skia/third_party/externals
            git clone --depth 1 --branch "$LIBJPEG_TAG" \
              https://github.com/libjpeg-turbo/libjpeg-turbo.git \
              skia/third_party/externals/libjpeg-turbo
          fi
          echo "--- libjpeg-turbo contents ---"
          ls -la skia/third_party/externals/libjpeg-turbo | head -n 40

      - name: Download Aseprite source
        shell: bash
        run: |
          set -e
          curl -f -o Aseprite-source.zip -L "$ASEPRITE_SOURCE_URL"
          7z x Aseprite-source.zip -oaseprite
          mkdir -p aseprite/build

      - name: Setting Visual Studio build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run CMake
        working-directory: aseprite/build
        shell: cmd
        run: cmake -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DCMAKE_IGNORE_PATH="C:/ProgramData/chocolatey/bin/;C:/Strawberry/c/bin/" -DLAF_BACKEND=skia -DSKIA_DIR=../../skia -DSKIA_LIBRARY_DIR=../../skia/out/Release-x64 -G Ninja ..

      - name: Run Ninja
        working-directory: aseprite/build
        run: ninja aseprite

      - name: Clean up build
        working-directory: aseprite/build/bin
        shell: bash
        run: rm -f gen modp_b64_gen gen.exe gen.exe.manifest modp_b64_gen.exe modp_b64_gen.exe.manifest

      - name: Make portable zip
        working-directory: aseprite/build/bin
        shell: bash
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini

      - name: Create release zip
        working-directory: aseprite/build/bin
        shell: bash
        run: 7z a -tzip "Aseprite-${LATEST_TAG}-Windows.zip" *

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.LATEST_TAG }}-${{ github.run_number }}
          name: Release Aseprite ${{ env.LATEST_TAG }} (Build #${{ github.run_number }})
          body: Manual build of Aseprite ${{ env.LATEST_TAG }}
          draft: false
          prerelease: false
          files: aseprite/build/bin/Aseprite-${{ env.LATEST_TAG }}-Windows.zip
